<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <title>Library - vivalink.top</title>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <style>
        :root {
            --accent: #667eea;
            --accent2: #764ba2;
            --bg: #f5f4f0;
            --card: #ffffff;
            --text: #1a1a2e;
            --muted: #888;
            --border: #e8e6e0;
            --reader-bg: #faf8f3;
            --reader-text: #2c2c2c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Login ─────────────────────────────────────────────── */
        #page-login {
            display: none;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-card h1 { font-size: 2rem; margin-bottom: 0.4rem; color: var(--text); }
        .login-card p { color: var(--muted); margin-bottom: 2rem; font-family: sans-serif; font-size: 0.9rem; }
        .login-input {
            width: 100%; padding: 0.85rem 1rem;
            border: 2px solid var(--border); border-radius: 10px;
            font-size: 1rem; font-family: sans-serif;
            margin-bottom: 1rem; transition: border-color 0.2s;
        }
        .login-input:focus { outline: none; border-color: var(--accent); }
        .login-btn {
            width: 100%; padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white; border: none; border-radius: 10px;
            font-size: 1rem; font-family: sans-serif; font-weight: 600;
            cursor: pointer; transition: opacity 0.2s;
        }
        .login-btn:hover { opacity: 0.9; }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-msg { margin-top: 1rem; padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.9rem; font-family: sans-serif; display: none; }
        .login-msg.ok  { background: #d4edda; color: #155724; border-left: 3px solid #28a745; display: block; }
        .login-msg.err { background: #f8d7da; color: #721c24; border-left: 3px solid #dc3545; display: block; }

        /* ── Bibliothèque ──────────────────────────────────────── */
        #page-library { display: none; }

        .lib-header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky; top: 0; z-index: 10;
        }
        .lib-header h1 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .lib-brand {
            display: flex; align-items: center; gap: 0.5rem;
        }
        .lib-count-tag {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white; font-size: 0.72rem; font-family: sans-serif;
            font-weight: 700; padding: 0.15rem 0.55rem; border-radius: 20px;
            letter-spacing: 0.01em; opacity: 0.9;
        }
        .header-right { display: flex; align-items: center; gap: 0.6rem; }

        /* ── Boutons de tri ── */
        .sort-btn {
            background: linear-gradient(135deg, #888, #666);
            border: none;
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-family: sans-serif;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }
        .sort-btn:hover {
            background: linear-gradient(135deg, #999, #777);
            opacity: 1;
        }
        .sort-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-color: transparent;
            color: white;
        }
        .sort-arrow {
            font-size: 0.7rem;
            display: inline-block;
            transition: transform 0.2s;
        }

        .count-badge {
            background: var(--bg); border: 1px solid var(--border);
            padding: 0.3rem 0.8rem; border-radius: 20px;
            font-size: 0.8rem; font-family: sans-serif; color: var(--muted);
        }
        .logout-bottom {
            display: flex; justify-content: center;
            padding: 1.5rem 2rem 2rem;
        }
        .logout-btn {
            background: none; border: 1px solid var(--border);
            padding: 0.35rem 0.9rem; border-radius: 8px;
            font-size: 0.82rem; font-family: sans-serif; color: var(--muted);
            cursor: pointer; transition: all 0.2s;
        }
        .logout-btn:hover { border-color: #dc3545; color: #dc3545; }
        .read-filter-btn {
            background: linear-gradient(135deg, #888, #666);
            border: none;
            padding: 0.3rem 0.7rem; border-radius: 20px;
            font-size: 0.78rem; font-family: sans-serif; color: white;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
            display: flex; align-items: center;
        }
        .read-filter-btn:hover { background: linear-gradient(135deg, #999, #777); }
        .read-filter-btn.active-read { background: linear-gradient(135deg, #43a047, #2e7d32); border-color: transparent; color: white; }
        .read-filter-btn.active-unread { background: linear-gradient(135deg, #f9a825, #f57f17); border-color: transparent; color: white; }

        .lib-search {
            padding: 1.2rem 2rem;
            background: white;
            border-bottom: 1px solid var(--border);
        }
        .search-input {
            width: 100%; padding: 0.75rem 1rem;
            border: 2px solid var(--border); border-radius: 10px;
            font-size: 0.95rem; font-family: sans-serif;
            background: var(--bg); transition: all 0.2s;
        }
        .search-input:focus { outline: none; border-color: var(--accent); background: white; }

        .book-list {
            list-style: none;
            padding: 1rem 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .book-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .book-item:hover {
            background: white;
            border-left-color: var(--accent);
            box-shadow: 0 2px 12px rgba(102,126,234,0.1);
            transform: translateX(2px);
        }

        .book-icon { font-size: 1.4rem; flex-shrink: 0; }

        .book-info { flex: 1; min-width: 0; }
        .book-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .book-sub {
            display: flex; align-items: center; gap: 0.5rem;
            margin-top: 0.15rem;
        }
        .book-author {
            font-size: 0.82rem; color: var(--accent);
            font-family: sans-serif; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .book-year {
            font-size: 0.78rem; color: var(--muted);
            font-family: sans-serif; flex-shrink: 0;
        }
        .book-page-tag {
            display: inline-flex; align-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white; font-size: 0.7rem; font-family: sans-serif;
            font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 20px;
            flex-shrink: 0; white-space: nowrap; opacity: 0.85;
        }

        .book-desc {
            font-size: 0.78rem; color: var(--muted);
            font-family: sans-serif; margin-top: 0.2rem;
            display: -webkit-box; -webkit-line-clamp: 1;
            -webkit-box-orient: vertical; overflow: hidden;
        }

        .book-actions {
            display: flex; gap: 0.4rem; flex-shrink: 0;
        }

        .btn-read, .btn-dl {
            padding: 0.35rem 0.75rem; border-radius: 6px;
            font-size: 0.78rem; font-family: sans-serif; font-weight: 600;
            cursor: pointer; border: none; transition: all 0.15s;
        }
        .btn-dl {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
        }
        .btn-dl:hover { opacity: 0.85; }
        .btn-read {
            background: var(--bg); color: var(--muted);
            border: 1px solid var(--border);
            opacity: 0; transition: all 0.15s;
        }
        .book-item:hover .btn-read { opacity: 1; }
        .btn-read:hover { border-color: var(--accent); color: var(--accent); }

        .no-books {
            text-align: center; padding: 4rem 2rem;
            color: var(--muted); font-family: sans-serif; font-style: italic;
        }

        .spinner {
            border: 3px solid var(--border); border-top: 3px solid var(--accent);
            border-radius: 50%; width: 36px; height: 36px;
            animation: spin 1s linear infinite; margin: 4rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: #f8d7da; color: #721c24;
            padding: 1rem; border-radius: 8px;
            border-left: 4px solid #dc3545; margin: 1rem 2rem;
            font-family: sans-serif;
        }

        /* ── Reader ────────────────────────────────────────────── */
        #page-reader {
            display: none;
            position: fixed; inset: 0; z-index: 100;
            background: var(--reader-bg);
            flex-direction: column;
            height: 100vh;
        }

        .reader-header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex; align-items: center; gap: 1rem;
            flex-shrink: 0;
        }
        .reader-back {
            background: none; border: 1px solid var(--border);
            padding: 0.4rem 0.9rem; border-radius: 8px;
            font-size: 0.85rem; font-family: sans-serif; color: var(--muted);
            cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .reader-back:hover { border-color: var(--accent); color: var(--accent); }
        .reader-title {
            flex: 1; font-size: 0.95rem; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .reader-controls {
            display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0;
        }
        .ctrl-btn {
            background: none; border: 1px solid var(--border);
            width: 32px; height: 32px; border-radius: 6px;
            font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
            display: flex; align-items: center; justify-content: center;
            font-family: sans-serif; color: var(--text);
        }
        .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
        .ctrl-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .reader-body {
            display: flex; flex: 1; overflow: hidden;
            min-height: 0;
        }

        .reader-main {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; position: relative;
        }

        #epub-viewer {
            width: 100%;
            height: 100%;
            overflow: hidden;
            min-height: 0;
        }

        #epub-viewer iframe {
            width: 100% !important;
            height: 100% !important;
        }

        .reader-nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.75rem 1.5rem;
            background: white; border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .nav-btn {
            background: none; border: 1px solid var(--border);
            padding: 0.5rem 1.2rem; border-radius: 8px;
            font-size: 0.85rem; font-family: sans-serif; color: var(--text);
            cursor: pointer; transition: all 0.2s;
        }
        .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .reader-progress {
            font-size: 0.8rem; font-family: sans-serif; color: var(--muted);
        }

        .goto-form {
            display: flex; align-items: center; gap: 0.4rem;
        }
        .goto-input {
            width: 58px; padding: 0.3rem 0.5rem;
            border: 1px solid var(--border); border-radius: 6px;
            font-size: 0.82rem; font-family: sans-serif;
            text-align: center; color: var(--text);
            background: var(--bg); transition: all 0.2s;
        }
        .goto-input:focus { outline: none; border-color: var(--accent); background: white; }
        .goto-input:disabled { opacity: 0.35; cursor: not-allowed; }
        .goto-btn {
            background: none; border: 1px solid var(--border);
            padding: 0.3rem 0.6rem; border-radius: 6px;
            font-size: 0.78rem; font-family: sans-serif; color: var(--muted);
            cursor: pointer; transition: all 0.2s;
        }
        .goto-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .goto-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .reader-loading {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--reader-bg); z-index: 5;
        }

        .reader-dark {
            --reader-bg: #1a1a1a;
            --reader-text: #e0d8cc;
            --border: #333;
        }
        .reader-dark .reader-header,
        .reader-dark .toc-panel,
        .reader-dark .reader-nav { background: #242424; }
        .reader-dark .reader-title { color: #e0d8cc; }
        .reader-dark .toc-item { color: #bbb; }

        /* Responsive */
        @media (max-width: 600px) {
            .lib-header { padding: 0.8rem 1rem; gap: 0.4rem; flex-wrap: wrap; }
            .lib-search { padding: 0.8rem 1rem; }
            .book-list { padding: 0.5rem 0.8rem; }
            .book-actions { opacity: 1; }
            .sort-btn span:not(.sort-arrow) { display: none; }
        }
    </style>
</head>
<body>

<!-- ── Login ── -->
<div id="page-login" style="display:flex">
    <div class="login-card">
        <h1>📚 <i>Library</i></h1>
        <p>Entrez votre email pour recevoir un lien de connexion</p>
        <input type="email" id="login-email" class="login-input" placeholder="votre@email.com" />
        <button id="login-btn" class="login-btn">Envoyer le lien</button>
        <div id="login-msg" class="login-msg"></div>
    </div>
</div>

<!-- ── Bibliothèque ── -->
<div id="page-library">
    <div class="lib-header">
        <div class="lib-brand">
            <h1>📚 <i>Library</i></h1>
            <span class="lib-count-tag" id="lib-count-tag">#—</span>
        </div>
        <div class="header-right">
            <button class="sort-btn" id="sort-title-btn" title="Trier par titre">
                <svg width="11" height="14" viewBox="0 0 11 14" fill="none" xmlns="http://www.w3.org/2000/svg"><text x="0" y="12" font-family="Georgia,serif" font-weight="700" font-size="13" fill="currentColor">T</text></svg>
            </button>
            <button class="sort-btn" id="sort-author-btn" title="Trier par auteur">
                <svg width="11" height="14" viewBox="0 0 11 14" fill="none" xmlns="http://www.w3.org/2000/svg"><text x="0" y="12" font-family="Georgia,serif" font-weight="700" font-size="13" fill="currentColor">A</text></svg>
            </button>
            <button class="read-filter-btn" id="read-filter-btn" title="Tous / Lus / Non lus">
                <svg id="read-filter-icon" width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- infini (état: tous) -->
                    <path d="M6.5 6C6.5 4.07 5.16 2.5 3.5 2.5C1.84 2.5 0.5 4.07 0.5 6C0.5 7.93 1.84 9.5 3.5 9.5C4.7 9.5 5.74 8.68 6.25 7.5L6.5 6Z" stroke="currentColor" stroke-width="1.4" fill="none"/>
                    <path d="M11.5 6C11.5 7.93 12.84 9.5 14.5 9.5C16.16 9.5 17.5 7.93 17.5 6C17.5 4.07 16.16 2.5 14.5 2.5C13.3 2.5 12.26 3.32 11.75 4.5L11.5 6Z" stroke="currentColor" stroke-width="1.4" fill="none"/>
                    <path d="M6.25 7.5C6.76 8.68 7.8 9.5 9 9.5C10.2 9.5 11.24 8.68 11.75 7.5" stroke="currentColor" stroke-width="1.4" fill="none"/>
                    <path d="M6.25 4.5C6.76 3.32 7.8 2.5 9 2.5C10.2 2.5 11.24 3.32 11.75 4.5" stroke="currentColor" stroke-width="1.4" fill="none"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="lib-search">
        <input type="text" id="search" class="search-input" placeholder="🔍 Rechercher un titre, un auteur…">
    </div>
    <ul class="book-list" id="book-list">
        <div class="spinner"></div>
    </ul>
    <div class="logout-bottom">
        <button class="logout-btn" id="logout-btn">Déconnexion</button>
    </div>
</div>

<!-- ── Reader ── -->
<div id="page-reader">
    <div class="reader-header">
        <button class="reader-back" id="reader-back">← Retour</button>
        <span class="reader-title" id="reader-title"></span>
        <div class="reader-controls">
            <button class="ctrl-btn" id="ctrl-smaller" title="Réduire la police">A−</button>
            <button class="ctrl-btn" id="ctrl-bigger" title="Agrandir la police">A+</button>
            <button class="ctrl-btn" id="ctrl-dark" title="Mode sombre">◑</button>
        </div>
    </div>
    <div class="reader-body">
        <div class="reader-main">
            <div class="reader-loading" id="reader-loading">
                <div class="spinner"></div>
            </div>
            <div id="epub-viewer"></div>
        </div>
    </div>
    <div class="reader-nav">
        <button class="nav-btn" id="nav-prev">←</button>
        <div class="goto-form">
            <span class="reader-progress" id="reader-progress"></span>
            <input type="number" id="goto-input" class="goto-input" min="1" placeholder="p." title="Aller à la page" disabled />
            <button id="goto-btn" class="goto-btn" disabled>→</button>
        </div>
        <button class="nav-btn" id="nav-next">→</button>
    </div>
</div>

<script>
    const AUTH_URL  = 'https://auth.vivalink.top';
    const API_URL   = 'https://library-api.vivalink.top';
    const TOKEN_KEY = 'library_device_token';

    let allBooks = [];
    let currentBook = null;
    let rendition = null;
    let fontSize = parseInt(localStorage.getItem('reader_fontsize') || '100');
    let darkMode = localStorage.getItem('reader_dark') === '1';

    // État du tri : null = pas actif, 'asc' ou 'desc'
    let sortState = { key: null, dir: null };
    // 'all' | 'read' | 'unread'
    let readFilter = 'all';

    /* ── Auth ── */
    const getToken   = () => localStorage.getItem(TOKEN_KEY);
    const setToken   = t  => localStorage.setItem(TOKEN_KEY, t);
    const clearToken = () => localStorage.removeItem(TOKEN_KEY);

    function showPage(name) {
        ['login','library','reader'].forEach(p => {
            const el = document.getElementById('page-' + p);
            el.style.display = 'none';
        });
        const target = document.getElementById('page-' + name);
        target.style.display = name === 'login' ? 'flex' : 'block';
    }

    async function checkToken() {
        const t = getToken();
        if (!t) return false;
        try {
            const r = await fetch(AUTH_URL + '/auth/me', { headers: { Authorization: 'Bearer ' + t } });
            return r.ok;
        } catch { return false; }
    }

    async function handleMagicLink() {
        const params = new URLSearchParams(window.location.search);
        const token  = params.get('token');
        if (!token) return false;
        try {
            const r = await fetch(AUTH_URL + '/auth/login?token=' + encodeURIComponent(token));
            if (!r.ok) return false;
            const d = await r.json();
            if (d.device_token) { setToken(d.device_token); window.history.replaceState({}, '', window.location.pathname); return true; }
        } catch {}
        return false;
    }

    async function requestMagicLink(email) {
        const btn = document.getElementById('login-btn');
        const msg = document.getElementById('login-msg');
        btn.disabled = true; btn.textContent = 'Envoi…'; msg.className = 'login-msg';
        try {
            const r = await fetch(AUTH_URL + '/auth/request-login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            if (r.ok) { msg.className = 'login-msg ok'; msg.textContent = '✅ Lien envoyé ! Vérifiez votre boîte mail.'; document.getElementById('login-email').value = ''; }
            else       { msg.className = 'login-msg err'; msg.textContent = '❌ Erreur lors de l\'envoi.'; }
        } catch    { msg.className = 'login-msg err'; msg.textContent = '❌ Service indisponible.'; }
        finally    { btn.disabled = false; btn.textContent = 'Envoyer le lien'; }
    }

    async function logout() {
        const t = getToken();
        if (t) { try { await fetch(AUTH_URL + '/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + t } }); } catch {} }
        clearToken(); showPage('login');
    }

    /* ── Tri ── */
    function getSortValue(book, key) {
        if (key === 'title') {
            return (book.displayName || '').toLowerCase();
        }
        if (key === 'author') {
            const authors = book.metadata?.authors;
            return (authors && authors.length ? authors[0] : '').toLowerCase();
        }
        return '';
    }

    function applySort(books) {
        if (!sortState.key) return books;
        return [...books].sort((a, b) => {
            const va = getSortValue(a, sortState.key);
            const vb = getSortValue(b, sortState.key);
            const cmp = va.localeCompare(vb, 'fr', { sensitivity: 'base' });
            return sortState.dir === 'asc' ? cmp : -cmp;
        });
    }

    function updateSortButtons() {
        const titleBtn  = document.getElementById('sort-title-btn');
        const authorBtn = document.getElementById('sort-author-btn');

        // Reset
        titleBtn.classList.remove('active');
        authorBtn.classList.remove('active');
        if (sortState.key === 'title')  titleBtn.classList.add('active');
        else if (sortState.key === 'author') authorBtn.classList.add('active');
    }

    function handleSort(key) {
        if (sortState.key !== key) {
            // Nouvelle clé → on démarre en ascendant
            sortState = { key, dir: 'asc' };
        } else {
            // Même clé → on bascule
            sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
        }
        updateSortButtons();
        // Réappliquer avec le filtre de recherche courant
        const q = document.getElementById('search').value;
        filterBooks(q);
    }

    /* ── Liste des livres ── */
    function renderBooks(books) {
        const sorted = applySort(books);
        const list = document.getElementById('book-list');
        // count-badge removed from header (kept for compat if needed)
        document.getElementById('lib-count-tag').textContent = '#' + allBooks.length;

        if (!sorted.length) { list.innerHTML = '<li class="no-books">Aucun livre ne correspond.</li>'; return; }

        list.innerHTML = sorted.map((b, i) => {
            const m = b.metadata || {};
            const authors = m.authors?.join(', ') || '';
            const year    = m.date ? m.date.split('-')[0] : '';
            const desc    = m.description ? m.description.replace(/<[^>]*>/g,'').substring(0,120) : '';
            // On cherche l'index réel dans allBooks pour les actions
            const realIndex = allBooks.indexOf(b);
            const cachedPage = (() => {
                const locsRaw = localStorage.getItem('reader_locs_' + b.name);
                const posRaw  = localStorage.getItem('reader_pos_'  + b.name);
                if (!locsRaw || !posRaw) return null;
                try {
                    const tmp = ePub();
                    tmp.locations.load(locsRaw);
                    const page = tmp.locations.locationFromCfi(posRaw);
                    const total = tmp.locations.length();
                    return (page >= 0 && total > 0) ? Math.ceil((page + 1) / total * 100) : null;
                } catch { return null; }
            })();
            return `
            <li class="book-item" data-index="${realIndex}">
                <div class="book-info">
                    <div class="book-title">
                        ${cachedPage ? `<span class="book-page-tag">${cachedPage}</span> ` : ''}${b.displayName}</div>
                    <div class="book-sub">
                        ${authors ? `<span class="book-author">${authors}</span>` : ''}
                        ${year    ? `<span class="book-year">${year}</span>`    : ''}
                    </div>
                    ${desc ? `<div class="book-desc">${desc}</div>` : ''}
                </div>
                <button class="btn-read" data-index="${realIndex}">Lire</button>
            </li>`;
        }).join('');

        list.querySelectorAll('.btn-read').forEach(btn => {
            btn.addEventListener('click', e => { e.stopPropagation(); openReader(parseInt(btn.dataset.index)); });
        });
        list.querySelectorAll('.btn-dl').forEach(btn => {
            btn.addEventListener('click', e => { e.stopPropagation(); downloadBook(parseInt(btn.dataset.index)); });
        });
        list.querySelectorAll('.book-item').forEach(item => {
            item.addEventListener('click', () => downloadBook(parseInt(item.dataset.index)));
        });
    }

    async function loadBooks() {
        const list = document.getElementById('book-list');
        list.innerHTML = '<div class="spinner"></div>';
        try {
            const r = await fetch(API_URL + '/api/books', { headers: { Authorization: 'Bearer ' + getToken() } });
            if (r.status === 401) { clearToken(); showPage('login'); return; }
            const d = await r.json();
            allBooks = d.files;
            renderBooks(allBooks);
        } catch (err) {
            list.innerHTML = `<div class="error-msg">❌ Erreur : ${err.message}</div>`;
        }
    }

    function isRead(b) {
        return !!localStorage.getItem('reader_locs_' + b.name);
    }

    function applyReadFilter(books) {
        if (readFilter === 'read')   return books.filter(isRead);
        if (readFilter === 'unread') return books.filter(b => !isRead(b));
        return books;
    }

    function updateReadFilterBtn() {
        const btn = document.getElementById('read-filter-btn');
        btn.className = 'read-filter-btn';
        if (readFilter === 'read')        { btn.innerHTML = '<svg width="18" height="14" viewBox="0 0 18 14" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="9" cy="7" rx="8" ry="5" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="7" r="2.2" fill="currentColor"/></svg>';   btn.classList.add('active-read'); btn.title = 'Lus'; }
        else if (readFilter === 'unread') { btn.innerHTML = '<svg width="18" height="14" viewBox="0 0 18 14" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="9" cy="7" rx="8" ry="5" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="7" r="2.2" fill="currentColor"/><line x1="2" y1="1" x2="16" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'; btn.classList.add('active-unread'); btn.title = 'Non lus'; }
        else                              { btn.innerHTML = '<svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 6C6.5 4.07 5.16 2.5 3.5 2.5C1.84 2.5 0.5 4.07 0.5 6C0.5 7.93 1.84 9.5 3.5 9.5C4.7 9.5 5.74 8.68 6.25 7.5L6.5 6Z" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M11.5 6C11.5 7.93 12.84 9.5 14.5 9.5C16.16 9.5 17.5 7.93 17.5 6C17.5 4.07 16.16 2.5 14.5 2.5C13.3 2.5 12.26 3.32 11.75 4.5L11.5 6Z" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M6.25 7.5C6.76 8.68 7.8 9.5 9 9.5C10.2 9.5 11.24 8.68 11.75 7.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M6.25 4.5C6.76 3.32 7.8 2.5 9 2.5C10.2 2.5 11.24 3.32 11.75 4.5" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>';    btn.title = 'Tous'; }
    }

    function filterBooks(q) {
        const base = applyReadFilter(allBooks);
        if (!q.trim()) { renderBooks(base); return; }
        const s = q.toLowerCase();
        renderBooks(base.filter(b => {
            const m = b.metadata || {};
            return b.displayName.toLowerCase().includes(s)
                || m.authors?.some(a => a.toLowerCase().includes(s))
                || m.description?.toLowerCase().includes(s)
                || m.publisher?.toLowerCase().includes(s);
        }));
    }

    async function downloadBook(index) {
        const book = allBooks[index];
        const token = getToken();
        try {
            const r = await fetch(API_URL + book.path, { headers: { Authorization: 'Bearer ' + token } });
            if (r.status === 401) { logout(); return; }
            const blob = await r.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = book.name;
            a.click();
            URL.revokeObjectURL(a.href);
        } catch { alert('Erreur lors du téléchargement.'); }
    }

    /* ── Reader ── */
    async function openReader(index) {
        const book = allBooks[index];
        currentBook = book;
        showPage('reader');
        document.getElementById('reader-title').textContent = book.displayName;
        document.getElementById('reader-loading').style.display = 'flex';
        document.getElementById('reader-progress').textContent = '';

        applyDarkMode();

        if (rendition) { try { rendition.destroy(); } catch {} rendition = null; }
        document.getElementById('epub-viewer').innerHTML = '';

        const token = getToken();
        const url   = API_URL + book.path;

        try {
            const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const arrayBuffer = await r.arrayBuffer();

            const epubBook = ePub(arrayBuffer);
            const viewer = document.getElementById('epub-viewer');
            await new Promise(r => setTimeout(r, 50));
            const w = viewer.clientWidth  || window.innerWidth;
            const h = viewer.clientHeight || (window.innerHeight - 120);
            rendition = epubBook.renderTo('epub-viewer', {
                width:  w,
                height: h,
                spread: 'none',
            });

            const savedCfi = localStorage.getItem('reader_pos_' + book.name);

            rendition.display(savedCfi || undefined).then(() => {
                document.getElementById('reader-loading').style.display = 'none';
                applyFontSize();
            });

            const LOC_CACHE_KEY = 'reader_locs_' + book.name;
            let lastLoc = null;

            function updateProgress(loc) {
                if (!loc?.start?.cfi) return;
                const locs = epubBook.locations;
                if (!locs || !locs.length()) return; // pas encore prêt, on n'affiche rien
                const page  = locs.locationFromCfi(loc.start.cfi) + 1;
                const total = locs.length();
                document.getElementById('reader-progress').textContent = page + ' / ' + total;
            }

            // Goto page
            const gotoInput = document.getElementById('goto-input');
            const gotoBtn   = document.getElementById('goto-btn');

            function enableGoto(total) {
                gotoInput.disabled = false;
                gotoInput.max = total;
                gotoBtn.disabled = false;
            }

            function doGoto() {
                const locs = epubBook.locations;
                if (!locs || !locs.length()) return;
                const page = parseInt(gotoInput.value);
                if (!page || page < 1 || page > locs.length()) return;
                const cfi = locs.cfiFromLocation(page - 1);
                if (cfi) rendition.display(cfi);
            }

            gotoBtn.addEventListener('click', doGoto);
            gotoInput.addEventListener('keydown', e => { if (e.key === 'Enter') doGoto(); });

            rendition.on('relocated', loc => {
                lastLoc = loc;
                if (loc?.start?.cfi) localStorage.setItem('reader_pos_' + book.name, loc.start.cfi);
                updateProgress(loc);
            });

            // Locations : depuis le cache, ou calcul en arrière-plan
            const cachedLocs = localStorage.getItem(LOC_CACHE_KEY);
            if (cachedLocs) {
                try {
                    epubBook.locations.load(cachedLocs);
                    enableGoto(epubBook.locations.length());
                    if (lastLoc) updateProgress(lastLoc);
                } catch { localStorage.removeItem(LOC_CACHE_KEY); }
            } else {
                epubBook.locations.generate(1600).then(() => {
                    try { localStorage.setItem(LOC_CACHE_KEY, epubBook.locations.save()); } catch {}
                    enableGoto(epubBook.locations.length());
                    if (lastLoc) updateProgress(lastLoc);
                }).catch(() => {});
            }

        } catch (err) {
            document.getElementById('reader-loading').style.display = 'none';
            document.getElementById('epub-viewer').innerHTML =
                `<div class="error-msg" style="margin:2rem">❌ Impossible de charger le livre : ${err.message}</div>`;
        }
    }

    function applyFontSize() {
        if (!rendition) return;
        rendition.themes.fontSize(fontSize + '%');
        localStorage.setItem('reader_fontsize', fontSize);
    }

    function applyDarkMode() {
        const reader = document.getElementById('page-reader');
        if (darkMode) { reader.classList.add('reader-dark'); document.getElementById('ctrl-dark').classList.add('active'); }
        else           { reader.classList.remove('reader-dark'); document.getElementById('ctrl-dark').classList.remove('active'); }
        if (rendition) {
            rendition.themes.override('color', darkMode ? '#e0d8cc' : '');
            rendition.themes.override('background', darkMode ? '#1a1a1a' : '');
        }
        localStorage.setItem('reader_dark', darkMode ? '1' : '0');
    }

    function closeReader() {
        if (rendition) { try { rendition.destroy(); } catch {} rendition = null; }
        const gi = document.getElementById('goto-input');
        const gb = document.getElementById('goto-btn');
        if (gi) { gi.disabled = true; gi.value = ''; }
        if (gb) gb.disabled = true;
        showPage('library');
    }

    /* ── Événements reader ── */
    document.getElementById('reader-back').addEventListener('click', closeReader);

    document.getElementById('ctrl-smaller').addEventListener('click', () => {
        if (fontSize > 70) { fontSize -= 10; applyFontSize(); }
    });
    document.getElementById('ctrl-bigger').addEventListener('click', () => {
        if (fontSize < 160) { fontSize += 10; applyFontSize(); }
    });
    document.getElementById('ctrl-dark').addEventListener('click', () => {
        darkMode = !darkMode; applyDarkMode();
    });

    document.getElementById('nav-prev').addEventListener('click', () => rendition?.prev());
    document.getElementById('nav-next').addEventListener('click', () => rendition?.next());

    document.addEventListener('keydown', e => {
        if (document.getElementById('page-reader').style.display === 'none') return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  rendition?.next();
        if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    rendition?.prev();
        if (e.key === 'Escape') closeReader();
    });

    /* ── Événements bibliothèque ── */
    document.getElementById('login-btn').addEventListener('click', () => {
        const email = document.getElementById('login-email').value.trim();
        if (email) requestMagicLink(email);
    });
    document.getElementById('login-email').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
    document.getElementById('search').addEventListener('input', e => filterBooks(e.target.value));
    document.getElementById('logout-btn').addEventListener('click', logout);

    // Boutons de tri
    document.getElementById('sort-title-btn').addEventListener('click',  () => handleSort('title'));
    document.getElementById('sort-author-btn').addEventListener('click', () => handleSort('author'));

    // Filtre lu/non lu
    document.getElementById('read-filter-btn').addEventListener('click', () => {
        readFilter = readFilter === 'all' ? 'read' : readFilter === 'read' ? 'unread' : 'all';
        updateReadFilterBtn();
        filterBooks(document.getElementById('search').value);
    });

    /* ── Init ── */
    async function init() {
        document.getElementById('page-login').style.display = 'none';
        const loggedIn = await handleMagicLink();
        if (loggedIn || await checkToken()) {
            showPage('library');
            loadBooks();
        } else {
            clearToken();
            showPage('login');
        }
    }

    init();
</script>
</body>
