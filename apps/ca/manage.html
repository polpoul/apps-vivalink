<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ca — Modération</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --off-white: #f4f5fa; --warm-gray: #ccd1e7; --mid-gray: #9ca9e7;
      --dark: #2c2b4c; --accent: #9ca9e7; --danger: #c0392b; --success: #27ae60;
      --pending: #e67e22;
      --shadow-soft: 0 4px 24px rgba(0,0,0,0.07);
      --shadow-lift: 0 8px 32px rgba(0,0,0,0.14);
    }
    html, body { min-height: 100%; background: var(--off-white); color: var(--dark); font-family: 'DM Sans', sans-serif; }

    #auth-overlay {
      position: fixed; inset: 0; background: var(--off-white);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; flex-direction: column; gap: 1.5rem; padding: 2rem; text-align: center;
    }
    #auth-overlay h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 400; }
    #auth-overlay h1 em { font-style: italic; color: var(--accent); }
    .auth-card {
      background: white; border-radius: 14px; padding: 2rem;
      width: 100%; max-width: 340px; box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      display: flex; flex-direction: column; gap: 1rem;
    }
    .auth-card p { color: var(--mid-gray); font-size: 0.88rem; line-height: 1.6; }
    .auth-card p strong { color: var(--dark); }
    .auth-card input[type="email"] {
      width: 100%; padding: 0.75rem 1rem;
      border: 1px solid var(--warm-gray); border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
      outline: none; background: var(--off-white); transition: border-color 0.2s;
    }
    .auth-card input[type="email"]:focus { border-color: var(--accent); background: white; }
    .auth-card .btn-primary {
      width: 100%; padding: 0.8rem; background: var(--dark); color: white; border: none;
      border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
      letter-spacing: 0.04em; cursor: pointer; transition: opacity 0.2s;
    }
    .auth-card .btn-primary:hover { opacity: 0.8; }
    .auth-card .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    #auth-msg { color: var(--danger); font-size: 0.82rem; min-height: 1rem; }
    #auth-sent { display: none; flex-direction: column; gap: 0.75rem; align-items: center; }
    #auth-sent .sent-icon { font-size: 2.5rem; }
    .btn-link { background: none; border: none; color: var(--mid-gray); font-size: 0.8rem; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-family: 'DM Sans', sans-serif; }
    .btn-link:hover { color: var(--dark); }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(244,245,250,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--warm-gray);
      padding: 1.2rem 2.5rem; display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 400; color: var(--dark); text-decoration: none; }
    .brand em { font-style: italic; color: var(--accent); }
    .page-label { font-size: 0.75rem; color: var(--mid-gray); letter-spacing: 0.1em; text-transform: uppercase; margin-left: 0.75rem; }
    .btn-back {
      display: flex; align-items: center; gap: 0.5rem;
      background: transparent; border: 1px solid var(--warm-gray); color: var(--dark);
      text-decoration: none; padding: 0.5rem 1.1rem; border-radius: 6px;
      font-size: 0.82rem; letter-spacing: 0.04em; transition: border-color 0.2s, background 0.2s;
    }
    .btn-back:hover { border-color: var(--dark); background: var(--warm-gray); }

    /* Filtres statut */
    #status-filter {
      padding: 0.75rem 2.5rem; background: white; border-bottom: 1px solid var(--warm-gray);
      display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;
    }
    .filter-label { font-size: 0.72rem; color: var(--mid-gray); letter-spacing: 0.08em; text-transform: uppercase; margin-right: 0.25rem; }
    .status-filter-btn {
      font-size: 0.75rem; font-family: 'DM Sans', sans-serif;
      padding: 0.3rem 0.9rem; border-radius: 99px;
      border: 1px solid var(--warm-gray); background: white;
      cursor: pointer; transition: all 0.15s; color: var(--dark);
    }
    .status-filter-btn.active { background: var(--dark); color: white; border-color: var(--dark); }
    #total-count { font-size: 0.78rem; color: var(--mid-gray); margin-left: auto; }

    /* Panneau gestion tags */
    #tags-panel-toggle {
      font-size: 0.78rem; font-family: 'DM Sans', sans-serif;
      padding: 0.3rem 0.9rem; border-radius: 6px;
      border: 1px solid var(--warm-gray); background: white;
      cursor: pointer; color: var(--dark); transition: all 0.15s;
    }
    #tags-panel-toggle:hover { border-color: var(--dark); }
    #tags-panel {
      display: none; padding: 0.9rem 2.5rem;
      background: white; border-bottom: 1px solid var(--warm-gray);
      gap: 0.5rem; flex-wrap: wrap; align-items: center;
    }
    #tags-panel.open { display: flex; }
    .tag-pill {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 99px;
      background: var(--warm-gray); color: var(--dark);
    }
    .tag-pill button {
      background: none; border: none; cursor: pointer; color: var(--mid-gray);
      font-size: 0.8rem; line-height: 1; padding: 0; transition: color 0.15s;
    }
    .tag-pill button:hover { color: var(--danger); }
    #tag-new-input {
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
      padding: 0.3rem 0.7rem; border: 1px solid var(--warm-gray);
      border-radius: 6px; outline: none; width: 140px;
    }
    #tag-new-input:focus { border-color: var(--accent); }
    #tag-add-btn {
      font-family: 'DM Sans', sans-serif; font-size: 0.78rem;
      padding: 0.3rem 0.8rem; border-radius: 6px;
      border: 1px solid var(--dark); background: var(--dark); color: white;
      cursor: pointer; transition: opacity 0.15s;
    }
    #tag-add-btn:hover { opacity: 0.8; }

    main { max-width: 1300px; margin: 0 auto; padding: 2rem 2.5rem 5rem; }

    #photo-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.2rem; align-items: start; }
    .photo-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-soft); transition: box-shadow 0.2s, transform 0.2s; position: relative; }
    .photo-card:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }
    .photo-card img { width: 100%; height: auto; display: block; }
    .photo-card-info { padding: 0.5rem 0.6rem 0.6rem; }
    .photo-card-uploader { font-size: 0.65rem; color: var(--accent); margin-bottom: 0.35rem; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .photo-card-date { font-size: 0.65rem; color: var(--mid-gray); margin-bottom: 0.35rem; }

    /* Badges statut */
    .status-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.62rem; padding: 0.15rem 0.5rem; border-radius: 99px;
      font-family: 'DM Sans', sans-serif;
    }
    .status-badge.pending  { background: #fff3e0; color: #e67e22; border: 1px solid #f0c27f; }
    .status-badge.approved { background: #e8f8f0; color: #27ae60; border: 1px solid #82d0a6; }
    .status-badge.refused  { background: #fdecea; color: #c0392b; border: 1px solid #f0a69e; }

    /* Actions modération */
    .mod-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
    .btn-approve, .btn-refuse {
      flex: 1; padding: 0.35rem 0.5rem; border-radius: 5px; border: none;
      font-family: 'DM Sans', sans-serif; font-size: 0.7rem; cursor: pointer;
      transition: opacity 0.15s; letter-spacing: 0.02em;
    }
    .btn-approve { background: var(--success); color: white; }
    .btn-refuse  { background: var(--danger); color: white; }
    .btn-approve:hover, .btn-refuse:hover { opacity: 0.8; }
    .btn-approve:disabled, .btn-refuse:disabled { opacity: 0.4; cursor: not-allowed; }

    .photo-card-delete {
      position: absolute; top: 0.4rem; right: 0.4rem;
      background: rgba(26,23,20,0.65); border: none; color: white;
      border-radius: 50%; width: 1.7rem; height: 1.7rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s, background 0.15s; font-size: 0.8rem;
    }
    .photo-card:hover .photo-card-delete { opacity: 1; }
    .photo-card-delete:hover { background: var(--danger); }

    .photo-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; }
    .tag-btn {
      font-size: 0.65rem; font-family: 'DM Sans', sans-serif;
      padding: 0.15rem 0.5rem; border-radius: 99px;
      border: 1px solid var(--warm-gray); background: white;
      cursor: pointer; transition: all 0.15s; color: var(--mid-gray); line-height: 1.6;
    }
    .tag-btn:hover { border-color: var(--accent); color: var(--dark); }
    .tag-btn.active { background: var(--dark); color: white; border-color: var(--dark); }

    .list-empty { display: flex; flex-direction: column; align-items: center; padding: 4rem 2rem; gap: 0.75rem; text-align: center; color: var(--mid-gray); font-size: 0.88rem; }
    .list-empty .icon { font-size: 2.5rem; opacity: 0.25; }

    #confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 400; align-items: center; justify-content: center; }
    #confirm-overlay.open { display: flex; }
    #confirm-box { background: white; border-radius: 12px; padding: 2rem; max-width: 320px; width: 90%; box-shadow: var(--shadow-lift); text-align: center; }
    #confirm-box h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; margin-bottom: 0.5rem; }
    #confirm-box p { color: var(--mid-gray); font-size: 0.86rem; margin-bottom: 1.5rem; }
    #confirm-box .btn-row { display: flex; gap: 0.75rem; justify-content: center; }
    #confirm-box button { padding: 0.6rem 1.3rem; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 0.86rem; cursor: pointer; border: 1px solid var(--warm-gray); background: transparent; }
    #confirm-box .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }

    #toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 0.86rem; z-index: 300; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; }
    #toast.show { opacity: 1; }
    #toast.success { background: var(--success); }
    #toast.error { background: var(--danger); }
  </style>
</head>
<body>

<div id="auth-overlay">
  <h1>Ca <em>&</em> Modération</h1>
  <div class="auth-card">
    <div id="auth-email-step" style="display:flex;flex-direction:column;gap:1rem;">
      <p>Accès réservé aux modérateurs. Entrez votre adresse email pour recevoir un <strong>lien de connexion</strong>.</p>
      <input type="email" id="email-input" placeholder="votre@email.com" autocomplete="email"
             onkeydown="if(event.key==='Enter') sendMagicLink()" />
      <button class="btn-primary" id="btn-send" onclick="sendMagicLink()">Envoyer le lien</button>
      <span id="auth-msg"></span>
    </div>
    <div id="auth-sent">
      <div class="sent-icon">✉️</div>
      <p>Lien envoyé à <strong id="sent-email"></strong>.<br><br>Cliquez sur le lien dans votre email.</p>
      <button class="btn-link" onclick="resetAuthForm()">Utiliser une autre adresse</button>
    </div>
  </div>
</div>

<header>
  <div style="display:flex;align-items:baseline;">
    <a class="brand" href="/">Ca <em>&</em> Photos</a>
    <span class="page-label">Modération</span>
  </div>
  <a class="btn-back" href="/">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    Galerie
  </a>
</header>

<div id="status-filter">
  <span class="filter-label">Statut</span>
  <button class="status-filter-btn active" data-status="all">Toutes</button>
  <button class="status-filter-btn" data-status="pending">En attente</button>
  <button class="status-filter-btn" data-status="approved">Approuvées</button>
  <button class="status-filter-btn" data-status="refused">Refusées</button>
  <span id="total-count"></span>
  <button id="tags-panel-toggle" onclick="toggleTagsPanel()">Tags</button>
</div>

<div id="tags-panel">
  <span class="filter-label">Tags</span>
  <div id="tag-pills"></div>
  <input type="text" id="tag-new-input" placeholder="Nouveau tag…" maxlength="40"
         onkeydown="if(event.key==='Enter') addTag()" />
  <button id="tag-add-btn" onclick="addTag()">Ajouter</button>
</div>

<main>
  <div id="photo-list"></div>
</main>

<div id="confirm-overlay">
  <div id="confirm-box">
    <h3>Supprimer ?</h3>
    <p>Cette action est irréversible.</p>
    <div class="btn-row">
      <button onclick="closeConfirm()">Annuler</button>
      <button class="btn-danger" onclick="confirmDelete()">Supprimer</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const AUTH   = 'https://auth.vivalink.top';
  const API    = 'https://ca.vivalink.top/api';
  const PHOTOS = 'https://ca.vivalink.top/photos';
  let token = localStorage.getItem('device_token') || '';
  let modEmail = localStorage.getItem('moderator_email') || '';
  let allPhotos = [];
  let availableTags = [];
  let activeStatus = 'all';
  let pendingDelete = null;

  function modHeaders(extra) {
    return { 'Authorization': `Bearer ${token}`, 'X-Moderator-Email': modEmail, ...extra };
  }

  // ── Auth ──────────────────────────────────────────────────────────────────

  async function handleLoginCallback() {
    const p = new URLSearchParams(location.search);
    const t = p.get('token');
    if (!t) return false;
    history.replaceState({}, '', location.pathname);
    try {
      const r = await fetch(`${AUTH}/auth/login?token=${encodeURIComponent(t)}`);
      if (r.ok) { const d = await r.json(); token = d.device_token; localStorage.setItem('device_token', token); return true; }
    } catch(e) {}
    return false;
  }

  async function checkAuth() {
    if (!token || !modEmail) return false;
    try {
      const r = await fetch(`${AUTH}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (r.ok) return true;
      token = ''; localStorage.removeItem('device_token'); return false;
    } catch { return false; }
  }

  async function sendMagicLink() {
    const email = document.getElementById('email-input').value.trim();
    const msg = document.getElementById('auth-msg');
    const btn = document.getElementById('btn-send');
    if (!email) { msg.textContent = 'Adresse email requise.'; return; }
    btn.disabled = true; btn.textContent = 'Envoi…';
    modEmail = email.toLowerCase();
    localStorage.setItem('moderator_email', modEmail);
    try {
      await fetch(`${AUTH}/auth/request-login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, app: 'ca', redirect_url: 'https://ca.vivalink.top/manage.html' })
      });
      document.getElementById('auth-email-step').style.display = 'none';
      document.getElementById('sent-email').textContent = email;
      document.getElementById('auth-sent').style.display = 'flex';
    } catch(e) {
      msg.textContent = 'Erreur réseau.';
      btn.disabled = false; btn.textContent = 'Envoyer le lien';
    }
  }

  function resetAuthForm() {
    document.getElementById('auth-sent').style.display = 'none';
    document.getElementById('auth-email-step').style.display = 'flex';
    document.getElementById('auth-msg').textContent = '';
    const btn = document.getElementById('btn-send');
    btn.disabled = false; btn.textContent = 'Envoyer le lien';
  }

  // ── Photos ────────────────────────────────────────────────────────────────

  async function loadTags() {
    try {
      const r = await fetch(`${API}/tags`, { headers: modHeaders() });
      if (r.ok) availableTags = await r.json() || [];
    } catch(e) {}
    renderTagPills();
  }

  async function saveTags() {
    try {
      const r = await fetch(`${API}/mod/tags`, {
        method: 'POST', headers: modHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(availableTags)
      });
      if (!r.ok) showToast('Erreur sauvegarde tags', 'error');
    } catch(e) { showToast('Erreur réseau', 'error'); }
  }

  function renderTagPills() {
    const container = document.getElementById('tag-pills');
    if (!container) return;
    container.innerHTML = '';
    availableTags.forEach(tag => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill';
      pill.innerHTML = `${tag}<button title="Supprimer" onclick="removeTag('${tag.replace(/'/g, "\\'")}')">✕</button>`;
      container.appendChild(pill);
    });
  }

  async function addTag() {
    const input = document.getElementById('tag-new-input');
    const val = input.value.trim();
    if (!val || availableTags.includes(val)) { input.focus(); return; }
    availableTags = [...availableTags, val];
    input.value = '';
    renderTagPills();
    await saveTags();
    showToast('Tag ajouté', 'success');
  }

  async function removeTag(tag) {
    availableTags = availableTags.filter(t => t !== tag);
    renderTagPills();
    await saveTags();
    showToast('Tag supprimé', 'success');
  }

  function toggleTagsPanel() {
    document.getElementById('tags-panel').classList.toggle('open');
  }

  async function loadPhotos() {
    try {
      const r = await fetch(`${API}/photos/list`, { headers: modHeaders() });
      if (r.status === 401) { token = ''; localStorage.removeItem('device_token'); location.reload(); return; }
      allPhotos = await r.json() || [];
      renderPhotoList();
    } catch(e) { console.error(e); }
  }

  // Filtres statut
  document.querySelectorAll('.status-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeStatus = btn.dataset.status;
      document.querySelectorAll('.status-filter-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderPhotoList();
    });
  });

  function statusLabel(s) {
    if (s === 'approved') return '<span class="status-badge approved">✓ Approuvée</span>';
    if (s === 'refused')  return '<span class="status-badge refused">✕ Refusée</span>';
    return '<span class="status-badge pending">⏳ En attente</span>';
  }

  function renderPhotoList() {
    const list = document.getElementById('photo-list');
    const filtered = activeStatus === 'all' ? allPhotos : allPhotos.filter(p => p.status === activeStatus);
    document.getElementById('total-count').textContent = `${filtered.length} / ${allPhotos.length} photos`;
    list.innerHTML = '';

    if (!filtered.length) {
      list.innerHTML = '<div class="list-empty"><div class="icon">🖼️</div><p>Aucune photo dans cette catégorie.</p></div>';
      return;
    }

    filtered.forEach(p => {
      const card = document.createElement('div'); card.className = 'photo-card';
      const date = new Date(p.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
      const isPending = p.status === 'pending';
      card.innerHTML = `
        <img src="${PHOTOS}/${p.filename}?t=${new Date(p.created_at).getTime()}" loading="lazy" alt="" />
        <div class="photo-card-info">
          <div class="photo-card-uploader">${p.uploader || '—'}</div>
          <div class="photo-card-date">${date}</div>
          ${statusLabel(p.status)}
          <div class="mod-actions">
            <button class="btn-approve" ${isPending ? '' : 'style="opacity:0.4"'}>✓ Approuver</button>
            <button class="btn-refuse"  ${isPending ? '' : 'style="opacity:0.4"'}>✕ Refuser</button>
          </div>
          ${availableTags.length ? `<div class="photo-tags"></div>` : ''}
        </div>
        <button class="photo-card-delete" title="Supprimer">✕</button>`;

      if (availableTags.length) {
        const tagsDiv = card.querySelector('.photo-tags');
        const photoTags = p.tags || [];
        availableTags.forEach(tag => {
          const btn = document.createElement('button');
          btn.className = 'tag-btn' + (photoTags.includes(tag) ? ' active' : '');
          btn.textContent = tag;
          btn.addEventListener('click', async () => {
            const current = [...card.querySelectorAll('.tag-btn.active')].map(b => b.textContent);
            const next = current.includes(tag) ? current.filter(t => t !== tag) : [...current, tag];
            try {
              const r = await fetch(`${API}/photos/${p.filename}/tags`, {
                method: 'PATCH', headers: modHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ tags: next })
              });
              if (r.ok) { btn.classList.toggle('active', next.includes(tag)); }
              else { showToast('Erreur tags', 'error'); }
            } catch(e) { showToast('Erreur réseau', 'error'); }
          });
          tagsDiv.appendChild(btn);
        });
      }

      card.querySelector('.btn-approve').addEventListener('click', () => moderate(p.filename, 'approve', card));
      card.querySelector('.btn-refuse').addEventListener('click', ()  => moderate(p.filename, 'refuse', card));
      card.querySelector('.photo-card-delete').addEventListener('click', () => askDelete(p.filename));
      list.appendChild(card);
    });
  }

  async function moderate(filename, action, card) {
    const btnApprove = card.querySelector('.btn-approve');
    const btnRefuse  = card.querySelector('.btn-refuse');
    btnApprove.disabled = true; btnRefuse.disabled = true;
    try {
      const r = await fetch(`${API}/photos/${filename}/${action}`, {
        method: 'PATCH', headers: modHeaders()
      });
      if (r.ok) {
        showToast(action === 'approve' ? 'Photo approuvée' : 'Photo refusée', 'success');
        loadPhotos();
      } else if (r.status === 401) {
        showToast('Accès modérateur requis', 'error');
        btnApprove.disabled = false; btnRefuse.disabled = false;
      } else {
        showToast('Erreur', 'error');
        btnApprove.disabled = false; btnRefuse.disabled = false;
      }
    } catch(e) { showToast('Erreur réseau', 'error'); btnApprove.disabled = false; btnRefuse.disabled = false; }
  }

  function askDelete(filename) { pendingDelete = filename; document.getElementById('confirm-overlay').classList.add('open'); }
  function closeConfirm() { pendingDelete = null; document.getElementById('confirm-overlay').classList.remove('open'); }
  async function confirmDelete() {
    if (!pendingDelete) return;
    const filename = pendingDelete; closeConfirm();
    try {
      const r = await fetch(`${API}/photos/${filename}`, { method: 'DELETE', headers: modHeaders() });
      if (r.ok) { showToast('Photo supprimée', 'success'); loadPhotos(); }
      else showToast('Erreur suppression', 'error');
    } catch(e) { showToast('Erreur réseau', 'error'); }
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show ' + type;
    setTimeout(() => { t.className = ''; }, 3000);
  }

  // ── Init ──────────────────────────────────────────────────────────────────

  (async () => {
    const loggedIn = await handleLoginCallback();
    if (loggedIn || await checkAuth()) {
      document.getElementById('auth-overlay').style.display = 'none';
      await loadTags();
      loadPhotos();
    }
  })();
</script>
</body>
</html>
