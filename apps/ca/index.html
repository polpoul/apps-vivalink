<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ca — Galerie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --off-white: #f4f5fa; --warm-gray: #ccd1e7; --mid-gray: #9ca9e7;
      --dark: #2c2b4c; --accent: #9ca9e7;
      --shadow-polaroid: 0 2px 8px rgba(0,0,0,0.12), 0 8px 32px rgba(0,0,0,0.08);
      --shadow-lift: 0 12px 48px rgba(0,0,0,0.18);
    }
    html, body { min-height: 100%; background: var(--off-white); color: var(--dark); font-family: 'DM Sans', sans-serif; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(244,245,250,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--warm-gray);
      padding: 1.2rem 2.5rem; display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
    }
    .brand { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 400; color: var(--dark); text-decoration: none; white-space: nowrap; }
    .brand em { font-style: italic; color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .photo-count { font-size: 0.78rem; color: var(--mid-gray); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
    .btn-share {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--accent); color: white; text-decoration: none;
      padding: 0.5rem 1.1rem; border-radius: 6px; font-size: 0.82rem; letter-spacing: 0.04em; transition: opacity 0.2s; white-space: nowrap;
    }
    .btn-share:hover { opacity: 0.75; }

    #filter-bar {
      display: none; padding: 0.8rem 2.5rem;
      background: rgba(244,245,250,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--warm-gray);
      gap: 0.5rem; flex-wrap: wrap; align-items: center;
    }
    #filter-bar.visible { display: flex; }
    .filter-label { font-size: 0.72rem; color: var(--mid-gray); letter-spacing: 0.08em; text-transform: uppercase; margin-right: 0.25rem; white-space: nowrap; }
    .filter-btn {
      font-size: 0.75rem; font-family: 'DM Sans', sans-serif;
      padding: 0.3rem 0.8rem; border-radius: 99px;
      border: 1px solid var(--warm-gray); background: white;
      cursor: pointer; transition: all 0.15s; color: var(--dark); letter-spacing: 0.03em;
    }
    .filter-btn:hover { border-color: var(--mid-gray); }
    .filter-btn.active { background: var(--dark); color: white; border-color: var(--dark); }
    .filter-sep { width: 1px; height: 1.2rem; background: var(--warm-gray); margin: 0 0.25rem; }

    main { padding: 2rem 2.5rem 5rem; max-width: 1400px; margin: 0 auto; }

    #empty-state { display: none; flex-direction: column; align-items: center; padding: 8rem 2rem; gap: 1rem; text-align: center; }
    #empty-state .icon { font-size: 3rem; opacity: 0.25; }
    #empty-state p { color: var(--mid-gray); }
    #empty-state a { color: var(--dark); font-weight: 500; font-size: 0.9rem; text-decoration: underline; text-underline-offset: 3px; }

    #gallery {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.8rem; align-items: start;
    }
    .polaroid {
      display: block; width: 100%; background: white; padding: 0.85rem 0.85rem 2.4rem;
      box-shadow: var(--shadow-polaroid); cursor: pointer; position: relative;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
      animation: fadeUp 0.5s ease both;
    }
    .polaroid:nth-child(4n+1) { transform: rotate(-1.3deg); }
    .polaroid:nth-child(4n+2) { transform: rotate(0.9deg); }
    .polaroid:nth-child(4n+3) { transform: rotate(-0.5deg); }
    .polaroid:nth-child(4n+4) { transform: rotate(1.1deg); }
    .polaroid:hover { transform: rotate(0deg) scale(1.04) !important; box-shadow: var(--shadow-lift); z-index: 10; }
    .polaroid img { display: block; width: 100%; height: auto; }
    .polaroid .caption {
      position: absolute; bottom: 0.65rem; left: 0; right: 0; text-align: center;
      font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.7rem;
      color: var(--mid-gray); padding: 0 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500; align-items: center; justify-content: center; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 92vw; max-height: 90vh; object-fit: contain; }
    #lb-close { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; opacity: 0.6; }
    #lb-close:hover { opacity: 1; }
    #lb-nav { position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); display: flex; gap: 1rem; align-items: center; }
    #lb-nav button { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 50%; width: 2.5rem; height: 2.5rem; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    #lb-nav button:hover { background: rgba(255,255,255,0.25); }
    #lb-counter { color: rgba(255,255,255,0.45); font-size: 0.8rem; min-width: 4rem; text-align: center; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; } }
  </style>
</head>
<body>

<header>
  <a class="brand" href="/">Ca <em>&</em> Photos</a>
  <div class="header-right">
    <span class="photo-count" id="photo-count"></span>
    <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.82rem;color:var(--mid-gray);">
      <input type="checkbox" id="diaporama-toggle" onchange="onDiaporamaToggle()" style="width:14px;height:14px;accent-color:var(--dark);cursor:pointer;" />
      Diaporama
    </label>
    <a class="btn-share" href="/mes-photos.html">Partager vos photos</a>
  </div>
</header>

<div id="filter-bar">
  <span class="filter-label">Filtrer</span>
  <button class="filter-btn active" data-tag="all">Tous</button>
</div>

<main>
  <div id="empty-state">
    <div class="icon">📷</div>
    <p>Aucune photo pour le moment.</p>
    <a href="/mes-photos.html">Partager vos photos →</a>
  </div>
  <div id="gallery"></div>
</main>

<div id="lightbox">
  <button id="lb-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" alt="" />
  <div id="lb-nav">
    <button onclick="navLightbox(-1)">‹</button>
    <span id="lb-counter"></span>
    <button onclick="navLightbox(1)">›</button>
  </div>
</div>

<script>
  const API    = 'https://ca.vivalink.top/api';
  const PHOTOS = 'https://ca.vivalink.top/photos';
  let allPhotos = [];
  let filteredPhotos = [];
  let activeTags = [];
  let availableTags = [];
  let lbIdx = 0;

  async function loadGallery() {
    try {
      const r = await fetch(`${API}/gallery/list`);
      if (!r.ok) return;
      allPhotos = await r.json() || [];
      await loadTags();
      buildFilterBar();
      applyFilter();
    } catch(e) { console.error(e); }
  }

  async function loadTags() {
    try {
      const r = await fetch(`${API}/tags`);
      if (r.ok) availableTags = await r.json() || [];
    } catch(e) {}
  }

  function buildFilterBar() {
    const bar = document.getElementById('filter-bar');
    if (!availableTags.length) { bar.classList.remove('visible'); return; }
    bar.innerHTML = '<span class="filter-label">Tags</span><button class="filter-btn active" data-tag="all">Tous</button>';
    availableTags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn'; btn.dataset.tag = tag; btn.textContent = tag;
      btn.addEventListener('click', () => toggleTagFilter(tag));
      bar.appendChild(btn);
    });
    bar.querySelector('[data-tag="all"]').addEventListener('click', () => { activeTags = []; document.querySelectorAll('#filter-bar .filter-btn').forEach(b => b.classList.toggle('active', b.dataset.tag === 'all')); applyFilter(); });
    bar.classList.add('visible');
  }

  function toggleTagFilter(tag) {
    if (activeTags.includes(tag)) { activeTags = activeTags.filter(t => t !== tag); }
    else { activeTags = [...activeTags, tag]; }
    document.querySelectorAll('#filter-bar [data-tag]').forEach(btn => {
      btn.classList.toggle('active', activeTags.length === 0 ? btn.dataset.tag === 'all' : activeTags.includes(btn.dataset.tag));
    });
    applyFilter();
  }

  function applyFilter() {
    filteredPhotos = activeTags.length === 0 ? allPhotos : allPhotos.filter(p => {
      const pt = p.tags || [];
      return activeTags.every(t => pt.includes(t));
    });
    renderGallery();
  }

  function renderGallery() {
    const gallery = document.getElementById('gallery');
    const empty = document.getElementById('empty-state');
    const countEl = document.getElementById('photo-count');
    gallery.innerHTML = '';
    if (!filteredPhotos.length) {
      empty.style.display = 'flex'; countEl.textContent = ''; return;
    }
    empty.style.display = 'none';
    const total = allPhotos.length, shown = filteredPhotos.length;
    countEl.textContent = shown === total ? `${total} photo${total > 1 ? 's' : ''}` : `${shown} / ${total} photo${total > 1 ? 's' : ''}`;
    filteredPhotos.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'polaroid'; div.style.animationDelay = `${i * 0.035}s`;
      const label = new Date(p.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
      div.innerHTML = `<img src="${PHOTOS}/${p.filename}?t=${new Date(p.created_at).getTime()}" loading="lazy" alt="" onerror="this.closest('.polaroid').style.display='none'" /><div class="caption">${label}</div>`;
      div.addEventListener('click', () => openLightbox(i));
      gallery.appendChild(div);
    });
  }

  function openLightbox(idx) { lbIdx = idx; updateLb(); document.getElementById('lightbox').classList.add('open'); document.body.style.overflow = 'hidden'; if (document.getElementById('diaporama-toggle').checked) startDiaporama(); }
  function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow = ''; stopDiaporama(); }
  function updateLb() { const p = filteredPhotos[lbIdx]; document.getElementById('lb-img').src = `${PHOTOS}/${p.filename}?t=${new Date(p.created_at).getTime()}`; document.getElementById('lb-counter').textContent = `${lbIdx + 1} / ${filteredPhotos.length}`; }
  function navLightbox(d) { lbIdx = (lbIdx + d + filteredPhotos.length) % filteredPhotos.length; updateLb(); if (document.getElementById('diaporama-toggle').checked) startDiaporama(); }
  document.getElementById('lightbox').addEventListener('click', e => { if (e.target === e.currentTarget) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') navLightbox(1);
    if (e.key === 'ArrowLeft') navLightbox(-1);
  });

  let diaporamaInterval = null;
  const DELAY = 3500;
  function onDiaporamaToggle() { const on = document.getElementById('diaporama-toggle').checked; if (on && document.getElementById('lightbox').classList.contains('open')) startDiaporama(); else stopDiaporama(); }
  function startDiaporama() { stopDiaporama(); diaporamaInterval = setInterval(() => { lbIdx = (lbIdx + 1) % filteredPhotos.length; updateLb(); }, DELAY); }
  function stopDiaporama() { if (diaporamaInterval) { clearInterval(diaporamaInterval); diaporamaInterval = null; } }

  loadGallery();
</script>
</body>
</html>
