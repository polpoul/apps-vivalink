
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fred & Nathalie — Jeu des invités</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF7F2;
    --ink: #1A1A1A;
    --gold: #C4943A;
    --gold-light: #E8D5A3;
    --muted: #8A8078;
    --card-w: min(100vw, 390px);
    --card-h: min(100vh, 844px);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
  }

  .deck {
    width: var(--card-w);
    height: var(--card-h);
    position: relative;
  }

  /* ── Card ── */
  .card {
    position: absolute;
    inset: 0;
    background: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 2.5rem 2rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    border-radius: 0;
  }

  .card.active {
    opacity: 1;
    pointer-events: all;
  }

  /* ── Top bar ── */
  .card-top {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-counter {
    font-size: 0.82rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  .card-level {
    font-size: 0.82rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    padding: 0.25rem 0.7rem;
    border: 1px solid currentColor;
    border-radius: 20px;
  }

  .level-facile { color: #5A8A5A; }
  .level-moyen { color: var(--gold); }
  .level-difficile { color: #A04040; }

  /* ── Divider ── */
  .divider {
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin: 0 auto;
  }

  /* ── Center content ── */
  .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    text-align: center;
    padding: 1.5rem 0;
  }

  .card-emoji {
    font-size: 4.2rem;
    line-height: 1;
    filter: grayscale(20%);
  }

  .card-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.75rem;
    line-height: 1.55;
    color: var(--ink);
    font-weight: 400;
  }

  .card-text em {
    font-style: italic;
    color: var(--gold);
  }

  /* ── Bottom ── */
  .card-bottom {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .card-names {
    font-size: 0.82rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 300;
  }

  .nav {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink);
    font-size: 0.92rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    padding: 0.5rem 0;
    opacity: 0.5;
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .nav-btn:not(:disabled):hover { opacity: 1; }
  .nav-btn:disabled { opacity: 0.15; cursor: default; }

  .nav-dots {
    display: flex;
    gap: 0.4rem;
  }

  .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold-light);
    transition: background 0.2s;
  }

  .dot.active { background: var(--gold); }

  /* ── Cover card ── */
  .card-cover {
    background: var(--ink);
    color: var(--cream);
  }

  .card-cover .card-body {
    gap: 1.5rem;
  }

  .cover-eyebrow {
    font-size: 0.82rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
  }

  .cover-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    line-height: 1.15;
    font-weight: 700;
    text-align: center;
  }

  .cover-title span {
    display: block;
    font-style: italic;
    font-weight: 400;
    font-size: 1.1rem;
    color: var(--gold-light);
    margin-top: 0.5rem;
    letter-spacing: 0.1em;
  }

  .cover-rule {
    width: 1px;
    height: 50px;
    background: var(--gold);
    margin: 0 auto;
  }

  .cover-instruction {
    font-size: 1rem;
    line-height: 1.7;
    color: #AAA;
    text-align: center;
    max-width: 280px;
    font-weight: 300;
  }

  .cover-instruction strong {
    color: var(--cream);
    font-weight: 500;
  }

  .start-btn {
    background: var(--gold);
    color: var(--ink);
    border: none;
    padding: 0.9rem 2.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    border-radius: 0;
  }

  .start-btn:hover { opacity: 0.85; }

  .card-cover .card-names { color: #555; }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
<body>

<div class="deck" id="deck">

  <!-- Cover -->
  <div class="card card-cover active" id="card-cover">
    <div class="card-top">
      <span class="card-counter">Jeu des invités</span>
    </div>

    <div class="card-body">
      <p class="cover-eyebrow">Levez-vous si…</p>
      <h1 class="cover-title">
        Fred<br>&amp; Nathalie
        <span>4 juillet 2026</span>
      </h1>
      <div class="cover-rule"></div>
      <p class="cover-instruction">
        L'animateur annonce<br>le numéro de la question.<br><br>
        Les invités lisent l'indice.<br>
        <strong>Les invités concernés se lèvent.</strong><br>
        Les mariés devinent ce qui les relie.<br>
        <i>3 indices maximums</i>
      </p>
      <button class="start-btn" onclick="startGame()">Commencer →</button>
    </div>


  </div>

  <!-- Cards will be injected here by JS -->
</div>

<script>
const cards = [
  {
    level: "facile",
    emoji: "🤸",
    text: "Levez-vous si vous avez déjà fait un sport avec <em>Fred</em> ou <em>Nathalie</em>"
  },
  {
    level: "facile",
    emoji: "🍕",
    text: "Levez-vous si vous avez déjà partagé un repas chez les parents de <em>Fred</em> ou de <em>Nathalie</em>"
  },
  {
    level: "facile",
    emoji: "✈️",
    text: "Levez-vous si vous avez voyagé avec <em>Fred</em> ou <em>Nathalie</em>"
  },
  {
    level: "moyen",
    emoji: "🎤",
    text: "Levez-vous si vous avez déjà entendu <em>Fred</em> ou <em>Nathalie</em> chanter — vraiment chanter"
  },
  {
    level: "moyen",
    emoji: "😭",
    text: "Levez-vous si vous avez vu <em>Fred</em> ou <em>Nathalie</em> pleurer, de joie ou de peine"
  },
  {
    level: "moyen",
    emoji: "🌙",
    text: "Levez-vous si vous avez passé une nuit blanche avec <em>Fred</em> ou <em>Nathalie</em>"
  },
  {
    level: "moyen",
    emoji: "🤫",
    text: "Levez-vous si l'un des mariés vous a confié un secret que l'autre ne connaît pas encore"
  },
  {
    level: "difficile",
    emoji: "💔",
    text: "Levez-vous si vous avez consolé <em>Fred</em> ou <em>Nathalie</em> après une rupture"
  },
  {
    level: "difficile",
    emoji: "🚨",
    text: "Levez-vous si vous avez participé à une bêtise avec <em>Fred</em> ou <em>Nathalie</em> sans que ses parents le sachent"
  },
  {
    level: "difficile",
    emoji: "🥇",
    text: "Levez-vous si vous pensez avoir été le·la meilleur·e ami·e de <em>Fred</em> ou <em>Nathalie</em>… avant que l'autre n'arrive"
  }
];

let current = 0;
let started = false;

const levelLabel = { facile: "Facile", moyen: "Moyen", difficile: "Difficile" };

function buildCards() {
  const deck = document.getElementById('deck');
  cards.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.id = 'card-' + i;
    el.innerHTML = `
      <div class="card-top">
        <span class="card-counter">${i + 1} / ${cards.length}</span>
        <span class="card-level level-${c.level}">${levelLabel[c.level]}</span>
      </div>
      <div class="card-body">
        <div class="card-emoji">${c.emoji}</div>
        <div class="divider"></div>
        <p class="card-text">${c.text}</p>
      </div>
      <div class="card-bottom">
        <p class="card-names">Fred &amp; Nathalie</p>
        <nav class="nav">
          <button class="nav-btn" onclick="prev()" ${i === 0 ? 'disabled' : ''}>← Précédent</button>
          <div class="nav-dots">
            ${cards.map((_, j) => `<div class="dot ${j === i ? 'active' : ''}" id="dot-${i}-${j}"></div>`).join('')}
          </div>
          <button class="nav-btn" onclick="next()" ${i === cards.length - 1 ? 'disabled' : ''}>Suivant →</button>
        </nav>
      </div>
    `;
    deck.appendChild(el);
  });
}

function showCard(index) {
  document.querySelectorAll('.card:not(.card-cover)').forEach(c => c.classList.remove('active'));
  const el = document.getElementById('card-' + index);
  if (el) el.classList.add('active');
  current = index;
}

function startGame() {
  document.getElementById('card-cover').classList.remove('active');
  started = true;
  showCard(0);
}

function next() {
  if (current < cards.length - 1) showCard(current + 1);
}

function prev() {
  if (current > 0) showCard(current - 1);
}

// Swipe support
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', e => {
  if (!started) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
});

buildCards();
</script>
</body>
</html>
