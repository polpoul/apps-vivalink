# ── agenda.vivalink.top ─────────────────────────────────────
server {
    listen 80;
    server_name agenda.vivalink.top;

    root /usr/share/nginx/apps/agenda;
    index index.html;

    # Toutes les routes renvoient index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pas de cache sur index.html pour que les mises à jour soient immédiates
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Gzip pour les performances
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
