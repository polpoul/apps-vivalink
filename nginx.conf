# ── nexo.vivalink.top ─────────────────────────────
# À ajouter à la fin de nginx.conf (dépôt apps-vivalink).
# Remplace nexo partout ci-dessous.
server {
    listen 80;
    server_name nexo.vivalink.top;
    root /usr/share/nginx/apps/nexo;
    index index.html;

    # data.json/views.json/saved-lists.json ne viennent JAMAIS du build (ils
    # contiennent de vraies données, jamais commitées) — servis depuis le
    # volume partagé avec save-server à la place des copies figées éventuellement
    # présentes dans le dossier assets/ du build. Doit être déclaré AVANT le
    # bloc location / générique pour prendre le dessus.
    location = /assets/data.json {
        alias /data/nexo/data.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /assets/views.json {
        alias /data/nexo/views.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /assets/saved-lists.json {
        alias /data/nexo/saved-lists.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}

# ── oria.vivalink.top ─────────────────────────────
# Métier "arbre familial" — même patron que nexo (voir son bloc plus haut),
# nom générique du volume/service : oria.
server {
    listen 80;
    server_name oria.vivalink.top;
    root /usr/share/nginx/apps/oria;
    index index.html;

    # data.json/views.json/saved-lists.json ne viennent JAMAIS du build (ils
    # contiennent de vraies données, jamais commitées) — servis depuis le
    # volume partagé avec save-server à la place des copies figées éventuellement
    # présentes dans le dossier assets/ du build. Doit être déclaré AVANT le
    # bloc location / générique pour prendre le dessus.
    location = /assets/data.json {
        alias /data/oria/data.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /assets/views.json {
        alias /data/oria/views.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /assets/saved-lists.json {
        alias /data/oria/saved-lists.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
# ── axio.vivalink.top ─────────────────────────────
# À ajouter à la fin de nginx.conf (dépôt apps-vivalink, sur un clone FRAIS —
# voir PROCEDURE.md, section "Piège" / avertissement sur la copie de travail).
server {
    listen 80;
    server_name axio.vivalink.top;
    root /usr/share/nginx/apps/axio;
    index index.html;

    # Données, vues et listes ne sont plus servies en statique : elles passent par
    # /api/data et /api/files/* (save-server), authentifiés et filtrés par propriétaire.
    location = /assets/data.json { return 404; }
    location = /assets/views.json { return 404; }
    location = /assets/saved-lists.json { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}

# ── campus.vivalink.top ───────────────────────────
server {
    listen 80;
    server_name campus.vivalink.top;
    root /usr/share/nginx/apps/campus;
    index index.html;

    # En-têtes de sécurité. La politique de contenu est la seconde barrière si le nettoyeur des diapositives HTML
    # (campus/src/app/slide/html-slide.ts) avait une faille : pas de script hors de ce site, pas d'image ni de
    # connexion ailleurs, pas d'incrustation. ATTENTION : un add_header dans un `location` REMPLACE ceux du bloc
    # parent ; ils sont donc répétés dans chaque location.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
